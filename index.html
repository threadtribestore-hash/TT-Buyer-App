<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TT Trade">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Thread Tribe Trade</title>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
  :root{
    --bg:#f2f4f7; --panel:#ffffff; --panel2:#f6f8fa; --line:#e1e6ec; --text:#16202c; --dim:#617183; --input:#eef1f5;
    --accent:#1f9e93; --accent-ink:#ffffff; --accent-soft:rgba(31,158,147,0.12);
    --amber:#c97c0e; --amber-soft:rgba(240,168,60,0.16); --red:#d0453e; --red-soft:rgba(232,97,90,0.13); --green:#2f8f40; --green-soft:rgba(126,208,138,0.18);
    --shadow:0 1px 2px rgba(16,24,40,0.06), 0 1px 3px rgba(16,24,40,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0d1117; --panel:#151c26; --panel2:#111821; --line:#243244; --text:#e3eaf2; --dim:#8a9bb0; --input:#0b1118;
      --accent:#4fd1c5; --accent-ink:#06201d; --accent-soft:rgba(79,209,197,0.14);
      --amber:#f0a83c; --red:#ef6b63; --green:#7ed08a; --shadow:none; }
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body{ background:var(--bg); }
  body{ color:var(--text); font-family:'Space Grotesk', system-ui, -apple-system, sans-serif; font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
    padding:calc(12px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom)); min-height:100vh; }
  .wrap{ max-width:560px; margin:0 auto; }
  button{ font:inherit; color:inherit; }
  .hidden{ display:none !important; }

  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0 14px; }
  .top-left{ min-width:0; }
  .eyebrow{ font-size:12px; font-weight:600; color:var(--accent); letter-spacing:0.3px; }
  .title{ font-size:22px; font-weight:700; letter-spacing:-0.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sync{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); background:var(--panel); border:1px solid var(--line); padding:6px 10px; border-radius:20px; white-space:nowrap; cursor:pointer; }
  .sync i{ width:8px; height:8px; border-radius:50%; background:var(--dim); display:inline-block; }
  .sync.live i{ background:var(--green); box-shadow:0 0 0 3px var(--green-soft); }
  .sync.off i{ background:var(--red); }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .h2{ font-size:13px; font-weight:600; color:var(--dim); margin:20px 4px 8px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .h2 .count{ background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:0 8px; font-size:12px; }
  .muted{ color:var(--dim); font-size:13px; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; }
  .row .r{ text-align:right; font-weight:600; white-space:nowrap; }
  .empty{ text-align:center; color:var(--dim); padding:28px 12px; }
  .empty b{ display:block; color:var(--text); font-size:17px; margin-bottom:4px; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:11px 16px; font-weight:600; font-size:14.5px; cursor:pointer; }
  .btn:active{ transform:scale(0.98); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.block{ width:100%; padding:15px 16px; font-size:16px; border-radius:14px; }
  .btn.small{ padding:8px 12px; font-size:13.5px; border-radius:10px; }
  .btn.danger{ color:var(--red); }
  .btn[disabled]{ opacity:0.5; }
  .link{ background:none; border:none; color:var(--accent); font-weight:600; cursor:pointer; padding:6px 0; font-size:14px; }
  .btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }

  .hello{ font-size:15px; color:var(--dim); margin:2px 4px 12px; }
  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow); text-align:left; }
  button.stat{ cursor:pointer; }
  .stat .k{ font-size:12.5px; color:var(--dim); }
  .stat .v{ font-size:22px; font-weight:700; letter-spacing:-0.4px; margin-top:2px; }
  .stat .s{ font-size:12px; color:var(--dim); margin-top:2px; }
  .stat .s.up{ color:var(--green); } .stat .s.down{ color:var(--amber); }
  .chart{ display:flex; align-items:flex-end; gap:5px; height:120px; margin-top:12px; }
  .chart .b{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; min-width:0; }
  .chart .b i{ display:block; width:100%; background:var(--accent); border-radius:5px 5px 2px 2px; min-height:2px; }
  .chart .b.now i{ background:var(--accent); opacity:0.55; }
  .chart .b span{ font-size:10.5px; color:var(--dim); }
  .chart .pair{ display:flex; align-items:flex-end; gap:2px; width:100%; height:100%; }
  .chart .pair i{ flex:1; }
  .chart i.sv, .legend i.sv{ background:var(--green); }
  .legend{ display:flex; gap:14px; margin-top:8px; font-size:12px; color:var(--dim); }
  .legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; background:var(--accent); margin-right:5px; vertical-align:-1px; }
  .bar{ height:8px; background:var(--panel2); border-radius:6px; overflow:hidden; margin-top:6px; border:1px solid var(--line); }
  .bar span{ display:block; height:100%; border-radius:6px; background:var(--accent); }

  .seg{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px; margin:0 -16px 8px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
  .seg::-webkit-scrollbar{ display:none; }
  .seg button{ flex:none; border:1px solid var(--line); background:var(--panel); border-radius:20px; padding:8px 14px; font-size:13.5px; font-weight:600; color:var(--dim); cursor:pointer; }
  .seg button.on{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .seg button .n{ margin-left:6px; font-size:12px; opacity:0.75; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .prod{ background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer; text-align:left; box-shadow:var(--shadow); padding:0; display:flex; flex-direction:column; }
  .prod .ph{ aspect-ratio:1/1; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-size:34px; color:var(--dim); }
  .prod .ph img{ width:100%; height:100%; object-fit:cover; display:block; }
  .prod .b{ padding:10px 12px 12px; }
  .prod .n{ font-weight:600; font-size:14px; line-height:1.25; }
  .prod .w{ font-size:12px; color:var(--dim); margin-top:2px; }
  .prod .p{ font-weight:700; margin-top:6px; }
  .prod .p s{ color:var(--dim); font-weight:500; font-size:12.5px; margin-left:4px; }
  .prod .mg{ font-size:12px; color:var(--green); font-weight:600; margin-top:2px; }
  .prod .p.por{ color:var(--accent); font-size:14px; }
  .search{ margin-bottom:10px; }
  .tools{ display:flex; gap:8px; margin-bottom:10px; }
  .tools select{ flex:1; padding:10px 12px; font-size:15px; }
  .tools .btn{ flex:none; }
  .fchips{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px; }
  .fchip{ border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); border-radius:20px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  label.check{ display:flex; gap:10px; align-items:center; color:var(--text); font-size:14.5px; margin-top:14px; cursor:pointer; }
  label.check input{ width:20px; height:20px; flex:none; accent-color:var(--accent); }

  .item{ display:flex; gap:12px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer; width:100%; text-align:left; box-shadow:var(--shadow); }
  .item .body{ flex:1; min-width:0; }
  .item .t{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .s{ font-size:13px; color:var(--dim); margin-top:2px; }
  .item .chev{ color:var(--dim); font-size:20px; }
  .item .amt{ font-weight:700; white-space:nowrap; }
  .chip{ display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:8px; background:var(--panel2); color:var(--dim); white-space:nowrap; }
  .chip.ok{ background:var(--green-soft); color:var(--green); } .chip.soon{ background:var(--amber-soft); color:var(--amber); } .chip.bad{ background:var(--red-soft); color:var(--red); } .chip.new{ background:var(--accent-soft); color:var(--accent); }

  .steps{ display:flex; align-items:center; margin:16px 0 4px; }
  .steps .st{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; color:var(--dim); position:relative; text-align:center; }
  .steps .st b{ width:24px; height:24px; border-radius:50%; border:2px solid var(--line); background:var(--panel); display:flex; align-items:center; justify-content:center; font-size:12px; z-index:1; }
  .steps .st.done b{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .steps .st.now b{ border-color:var(--accent); color:var(--accent); }
  .steps .st.now{ color:var(--text); font-weight:600; }
  .steps .st:not(:first-child)::before{ content:''; position:absolute; top:12px; right:50%; width:100%; height:2px; background:var(--line); }
  .steps .st.done:not(:first-child)::before, .steps .st.now:not(:first-child)::before{ background:var(--accent); }
  .prodbox{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .prodbox > div{ background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .prodbox .k{ font-size:12px; color:var(--dim); }
  .prodbox .v{ font-size:18px; font-weight:700; }

  label{ display:block; font-size:13px; color:var(--dim); margin:12px 0 6px; font-weight:500; }
  input, textarea, select{ width:100%; background:var(--input); border:1px solid var(--line); border-radius:12px; padding:13px 14px; font:inherit; font-size:16px; color:var(--text); outline:none; }
  input:focus, textarea:focus, select:focus{ border-color:var(--accent); }
  textarea{ min-height:84px; resize:vertical; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .qty{ display:flex; align-items:center; gap:8px; }
  .qty input{ text-align:center; font-weight:700; }
  .qty button{ width:46px; height:46px; flex:none; border-radius:12px; border:1px solid var(--line); background:var(--panel); font-size:20px; cursor:pointer; }
  .hint{ font-size:12.5px; color:var(--dim); margin-top:6px; }
  .note{ border-radius:12px; padding:12px 14px; font-size:14px; margin-top:12px; }
  .note.info{ background:var(--accent-soft); } .note.warn{ background:var(--amber-soft); } .note.bad{ background:var(--red-soft); } .note.good{ background:var(--green-soft); }
  .slabs{ width:100%; border-collapse:collapse; font-size:14px; }
  .slabs td{ padding:7px 0; border-bottom:1px solid var(--line); }
  .slabs td:last-child{ text-align:right; font-weight:600; }
  .slabs tr.on td{ color:var(--accent); font-weight:700; }
  .slabs tr.on td:first-child::before{ content:'▸ '; }
  .thumbs{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .thumb{ position:relative; width:84px; height:84px; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .thumb .x{ position:absolute; top:4px; right:4px; width:26px; height:26px; font-size:12px; }
  .qchips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .qchip{ border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:7px 12px; font-weight:600; font-size:14px; cursor:pointer; }
  .qchip.on{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .pline{ background:var(--panel); border:1px solid var(--accent); border-radius:14px; padding:12px 14px; margin:12px 0; }
  .pl-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .pl-price{ font-size:22px; font-weight:700; letter-spacing:-0.3px; }
  .pl-price small{ font-size:13px; color:var(--dim); font-weight:500; }
  .pl-price s{ font-size:14px; color:var(--dim); font-weight:500; }
  .pl-badge{ background:var(--green-soft); color:var(--green); font-weight:700; font-size:13px; padding:4px 10px; border-radius:20px; white-space:nowrap; }
  .pl-badge.none{ background:var(--panel2); color:var(--dim); }
  .pl-sub{ font-size:14px; margin-top:4px; }
  .pl-save{ color:var(--green); font-weight:600; }
  .pl-warn{ color:var(--red); font-size:13.5px; font-weight:600; margin-top:4px; }
  .nudge{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--accent-soft); border-radius:10px; padding:8px 10px; margin-top:8px; font-size:13.5px; }
  .nudge .btn{ flex:none; }
  .lines .ln{ display:grid; grid-template-columns:1fr 84px 34px; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .lines .ln input{ padding:9px 8px; text-align:center; font-size:15px; }
  .lines .ln .x{ width:34px; height:34px; }
  .sum .row{ padding:6px 0; border:none; }

  .big{ text-align:center; padding:22px 16px; }
  .big .k{ color:var(--dim); font-size:14px; }
  .big .v{ font-size:40px; font-weight:700; letter-spacing:-1px; margin:4px 0 2px; }

  .nav{ position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--panel); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(5, 1fr); }
  .nav button{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; font-size:11.5px; font-weight:600; color:var(--dim); cursor:pointer; position:relative; }
  .nav button svg{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .nav button.on{ color:var(--accent); }
  .cartbar{ position:fixed; left:12px; right:12px; bottom:calc(70px + env(safe-area-inset-bottom)); z-index:49; max-width:536px; margin:0 auto; background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px; padding:12px 16px;
    display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,0.18); }

  .scrim{ position:fixed; inset:0; background:rgba(5,8,12,0.5); z-index:80; opacity:0; transition:opacity .2s; }
  .scrim.show{ opacity:1; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:90; background:var(--bg); border-radius:22px 22px 0 0; max-height:92vh; overflow-y:auto; padding:8px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .25s ease; max-width:600px; margin:0 auto; overscroll-behavior:contain; }
  .sheet.show{ transform:none; }
  .grab{ width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 10px; }
  .sheet-h{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .sheet-h .t{ font-size:19px; font-weight:700; letter-spacing:-0.2px; }
  .x{ background:var(--panel); border:1px solid var(--line); border-radius:50%; width:34px; height:34px; flex:none; font-size:16px; cursor:pointer; }
  .hero{ width:100%; aspect-ratio:4/3; border-radius:14px; overflow:hidden; background:var(--panel2); margin:6px 0 10px; display:flex; align-items:center; justify-content:center; font-size:56px; color:var(--dim); }
  .hero img{ width:100%; height:100%; object-fit:cover; }

  .topbtns{ display:flex; gap:8px; align-items:center; flex:none; }
  .installpill{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:20px; padding:8px 14px; font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  .install{ display:flex; gap:14px; align-items:flex-start; background:var(--accent-soft); border:1px solid var(--accent); border-radius:16px; padding:16px; margin-bottom:12px; }
  .install img{ width:52px; height:52px; border-radius:12px; flex:none; }
  .install .t{ font-weight:700; font-size:16px; }
  .install .s{ font-size:13.5px; color:var(--dim); margin-top:2px; }
  .install ol{ margin:8px 0 0 18px; font-size:14px; }
  .install ol li{ margin:3px 0; }
  .signin{ max-width:420px; margin:40px auto 0; }
  .signin h1{ font-size:26px; letter-spacing:-0.4px; margin-bottom:6px; }
  .err{ color:var(--red); font-size:13.5px; margin-top:10px; min-height:18px; }

  .toast{ position:fixed; left:50%; bottom:calc(140px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:12px; font-size:14px; font-weight:600;
    opacity:0; transition:all .2s; z-index:200; max-width:calc(100% - 32px); text-align:center; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateX(-50%); }

  /* invoice (printable) */
  .inv{ position:fixed; inset:0; z-index:150; background:#fff; color:#111; overflow:auto; padding:20px 16px 40px; font-family:system-ui, -apple-system, sans-serif; }
  .inv .bar2{ display:flex; gap:8px; justify-content:flex-end; margin-bottom:14px; flex-wrap:wrap; }
  .inv .doc{ max-width:760px; margin:0 auto; font-size:12.5px; }
  .inv h1{ font-size:19px; margin-bottom:2px; }
  .inv table{ width:100%; border-collapse:collapse; margin:12px 0; }
  .inv th, .inv td{ border-bottom:1px solid #ddd; padding:6px 5px; text-align:left; vertical-align:top; }
  .inv td.n, .inv th.n{ text-align:right; white-space:nowrap; }
  .inv .meta{ display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-top:12px; }
  .inv .tot{ width:auto; margin-left:auto; min-width:280px; }
  .inv .tot td{ border:none; padding:3px 6px; }
  .inv .btn{ color:#111; background:#f2f4f7; border-color:#ccc; }
  .inv .words{ margin-top:6px; font-style:italic; }
  .inv .cat-head{ display:flex; justify-content:space-between; gap:16px; border-bottom:2px solid #111; padding-bottom:10px; }
  .inv .cat h2{ font-size:15px; margin:18px 0 8px; }
  .inv .cat-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
  .inv .cat-item{ border:1px solid #e3e3e3; border-radius:10px; overflow:hidden; break-inside:avoid; page-break-inside:avoid; }
  .inv .cat-ph{ aspect-ratio:1/1; background:#f4f4f4; display:flex; align-items:center; justify-content:center; font-size:40px; }
  .inv .cat-ph img{ width:100%; height:100%; object-fit:cover; display:block; }
  .inv .cat-n{ font-weight:600; padding:8px 10px 0; font-size:13px; }
  .inv .cat-s{ color:#666; padding:0 10px; font-size:12px; }
  .inv .cat-p{ font-weight:700; padding:4px 10px 10px; font-size:15px; }
  .inv .cat-p span{ font-weight:400; color:#666; font-size:12px; }
  .inv .cat-foot{ margin-top:18px; color:#444; }
  @media print{ .inv .cat-grid{ grid-template-columns:repeat(4, 1fr); } }
  @media print{ .inv .bar2{ display:none; } body > *:not(.inv){ display:none !important; } .inv{ position:static; padding:0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top">
    <div class="top-left"><div class="eyebrow" id="eyebrow">Thread Tribe Trade</div><div class="title" id="title">Welcome</div></div>
    <div class="topbtns"><button class="installpill hidden" id="installPill" data-a="install">⬇ Install app</button><button class="sync hidden" id="sync"><i></i><span id="syncText">Live</span></button></div>
  </div>
  <div id="signin" class="hidden"></div>
  <div id="screen" class="hidden"></div>
</div>

<button class="cartbar hidden" id="cartbar" data-go="cart"></button>

<script>
(function(){
  // ===================================================================
  // Thread Tribe Trade — the Buyer app for resellers (toys only).
  //
  // Two kinds of data:
  //  * buyer pack (read-only): what Thread Tribe publishes for this client —
  //    the toy catalogue at their price, ordering terms, their orders with
  //    production progress and Thread Tribe's invoices.
  //  * reseller docs (read/write): the reseller's own business — their
  //    customers, invoices to those customers, selling prices, stock moves
  //    and settings. Private to them; Thread Tribe only sees resale totals.
  // Orders to Thread Tribe go through buyer_submit_request and are confirmed
  // in the Master app, which recomputes prices.
  // ===================================================================
  var KEY = 'tt-buyer-app-v2';
  var CFG = window.TT_CONFIG || {};
  var CLOUD_URL = CFG.supabaseUrl || 'https://aeshadnzutizlpayhtnf.supabase.co';
  var CLOUD_KEY = CFG.supabaseKey || 'sb_publishable_tunpMMqpGPgRQreweefjTA_nBO7fXId';
  var FLOW = ['booked', 'in_production', 'production_done', 'shipped', 'delivered'];
  var STATUS = { quoted: 'Quote', booked: 'Confirmed', in_production: 'In production', production_done: 'Ready', shipped: 'Shipped', delivered: 'Delivered', cancelled: 'Cancelled' };
  var PAY = { unpaid: 'Unpaid', partial: 'Part paid', paid: 'Paid', refunded: 'Refunded', cancelled: 'Cancelled' };
  var SORTS = { recommended: 'Recommended', price_asc: 'Price: low to high', price_desc: 'Price: high to low', margin: 'Best margin',
    name: 'Name A–Z', light: 'Lightest first', heavy: 'Heaviest first', quick: 'Quickest to make' };
  var COLLS = ['customers', 'invoices', 'prices', 'stock', 'settings'];

  function blankFilt(){ return { sort: 'recommended', min: '', max: '', ordered: false, retailOnly: false }; }
  function blankDocs(){ var d = {}; COLLS.forEach(function(c){ d[c] = {}; }); return d; }
  var store = { pack: null, clientId: '', email: '', cart: [], requests: [], filt: blankFilt(), docs: blankDocs(), pending: [], reorderOf: '' };
  var sb = null, session = null, channel = null, live = null;
  var cloud = { status: '', otpEmail: '', err: '', choosing: null, rtDb: '', rtLive: '', missing: false, refreshTimer: null, booting: true, sending: false, bizMissing: false, flushing: false };
  var tab = 'home', shopSeg = 'all', shopQuery = '', orderSeg = 'active', bizSeg = 'invoices', bizQuery = '';
  var draft = null; // invoice being written

  // ---------- helpers ----------
  function load(){
    try{ var s = JSON.parse(localStorage.getItem(KEY)); if(s && typeof s === 'object') store = Object.assign(store, s); }catch(e){}
    if(!Array.isArray(store.cart)) store.cart = [];
    if(!Array.isArray(store.pending)) store.pending = [];
    store.filt = Object.assign(blankFilt(), store.filt || {});
    store.docs = Object.assign(blankDocs(), store.docs || {});
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML.replace(/"/g, '&quot;'); }
  function r2(v){ return Math.round((v || 0) * 100) / 100; }
  function money(v){ return '₹' + Math.round(v || 0).toLocaleString('en-IN'); }
  function money2(v){ return '₹' + r2(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function iso(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function today(){ return iso(new Date()); }
  function daysAgo(n){ var d = new Date(); d.setDate(d.getDate() - n); return iso(d); }
  // Plain dates ("2026-10-09") are calendar days; timestamps are shown in local time.
  function fmtDate(s){ if(!s) return ''; s = String(s); var d = new Date(s.length > 10 ? s : s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function monthKey(s){ return String(s || '').slice(0, 7); }
  function monthLabel(k){ var d = new Date(k + '-01T00:00:00'); return isNaN(d) ? k : d.toLocaleDateString('en-IN', { month: 'short' }); }
  function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 2600); }
  function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){} }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function num(v){ v = parseFloat(v); return isFinite(v) ? v : 0; }
  function val(id){ var el = document.getElementById(id); return el ? (el.value || '').trim() : ''; }
  function pack(){ return store.pack || { catalogue: [], orders: [], terms: {}, client: {}, business: {} }; }
  function T(){
    var t = pack().terms || {};
    return { minPerProduct: t.minPerProduct || 10, minOrder: t.minOrder || 25, maxDiscount: t.maxDiscount == null ? 20 : t.maxDiscount,
      slabs: Array.isArray(t.slabs) ? t.slabs : [], tierPct: t.tierPct || 0 };
  }
  // ---------- website toys ----------
  // The app also reads threadtribe.co directly, so every toy on the store shows even
  // before Thread Tribe's Studio has republished this buyer's pack. Toys the pack
  // prices keep that price; the rest are "price on request".
  var SHOP_URL = 'https://threadtribe.co', SHOP_TYPES = ['Flexi Toys', 'Fidget Clickers'], WEB_KEY = 'tt-buyer-web-toys-v1';
  var WEB = { items: [], at: 0, loading: false };
  try{ var wc = JSON.parse(localStorage.getItem(WEB_KEY)); if(wc && Array.isArray(wc.items)){ WEB.items = wc.items; WEB.at = wc.at || 0; } }catch(e){}
  function cleanName(t){ return String(t || '').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F\u200D]/gu, '').replace(/\s+/g, ' ').trim(); }
  function nameKey(t){ return cleanName(t).toLowerCase().replace(/[^a-z0-9]/g, ''); }
  async function loadWebToys(){
    if(WEB.loading || (WEB.at && Date.now() - WEB.at < 3 * 3600 * 1000)) return;
    WEB.loading = true;
    try{
      var all = [];
      for(var page = 1; page <= 4; page++){
        var r = await fetch(SHOP_URL + '/products.json?limit=250&page=' + page);
        if(!r.ok) break;
        var ps = ((await r.json()) || {}).products || [];
        all = all.concat(ps);
        if(ps.length < 250) break;
      }
      var items = all.filter(function(x){ return SHOP_TYPES.indexOf(x.product_type) !== -1; }).map(function(x){
        var img = x.images && x.images[0] ? x.images[0].src : '';
        var prices = (x.variants || []).map(function(v){ return parseFloat(v.price) || 0; }).filter(function(v){ return v > 0; });
        return { handle: x.handle, name: cleanName(x.title), category: x.product_type, retail: prices.length ? Math.min.apply(null, prices) : 0,
          photo: img ? img + (img.indexOf('?') === -1 ? '?' : '&') + 'width=600' : '' };
      });
      if(items.length){ WEB.items = items; WEB.at = Date.now(); try{ localStorage.setItem(WEB_KEY, JSON.stringify({ items: items, at: WEB.at })); }catch(e){} }
    }catch(e){}
    WEB.loading = false;
  }
  var catCache = { key: '', list: [] };
  function catalogue(){
    var base = pack().catalogue.filter(function(p){ return !p.kind || p.kind === 'toy'; });
    var key = base.length + '|' + WEB.at + '|' + (store.pack && store.pack.generatedAt);
    if(catCache.key === key) return catCache.list;
    var byName = {}, ids = {};
    base.forEach(function(p){ byName[nameKey(p.name)] = p; ids[p.id] = 1; });
    var out = base.map(function(p){
      var w = WEB.items.find(function(x){ return nameKey(x.name) === nameKey(p.name); });
      if(!w || (p.photo && p.retail)) return p;
      return Object.assign({}, p, { photo: p.photo || w.photo, retail: p.retail || w.retail, category: p.category || w.category });
    });
    WEB.items.forEach(function(w){
      if(ids['web:' + w.handle] || byName[nameKey(w.name)]) return;
      out.push({ id: 'web:' + w.handle, name: w.name, category: w.category, kind: 'toy', weight: 0, hours: 0, color: '', size: '', material: '', photo: w.photo, base: 0, price: 0, retail: w.retail, onRequest: true });
    });
    catCache = { key: key, list: out };
    return out;
  }
  function product(id){ return catalogue().find(function(p){ return p.id === id; }); }
  function isOpenOrder(o){ return ['quoted', 'booked', 'in_production', 'production_done', 'shipped'].indexOf(o.status) !== -1; }
  function realOrders(){ return pack().orders.filter(function(o){ return o.status !== 'quoted' && o.status !== 'cancelled'; }); }
  function openRequests(){ return (store.requests || []).filter(function(q){ return q.status === 'open'; }); }
  function totalDue(){ return pack().orders.reduce(function(s, o){ return s + (o.due || 0); }, 0); }
  function isLive(){ return cloud.rtLive === 'SUBSCRIBED' || cloud.rtDb === 'SUBSCRIBED'; }
  function friendlyErr(err){
    var m = String((err && err.message) || err || '');
    if(/does not exist|schema cache/i.test(m)) return 'Thread Tribe hasn’t switched this on yet.';
    if(/fetch|network|Load failed/i.test(m)) return 'No internet — try again when you’re online.';
    return m || 'Couldn’t send.';
  }

  // ---------- Thread Tribe pricing: tier % + quantity slab %, on the order's total pieces, capped ----------
  function slabFor(total){ var p = 0; T().slabs.forEach(function(s){ if(total >= s.min) p = s.pct; }); return p; }
  function orderPct(total){ var t = T(); return Math.min(t.maxDiscount, t.tierPct + slabFor(total)); }
  function priceAt(p, pct){ return Math.round(p.base * (1 - pct / 100)); }
  // Toys without a weight yet: shown and orderable, priced by Thread Tribe at confirmation.
  function onRequest(p){ return !p || !(p.base > 0); }
  function nextSlab(total){
    var t = T(), cur = orderPct(total);
    for(var i = 0; i < t.slabs.length; i++){
      var s = t.slabs[i];
      if(s.min > total && Math.min(t.maxDiscount, t.tierPct + s.pct) > cur) return { need: s.min - total, pct: Math.min(t.maxDiscount, t.tierPct + s.pct) };
    }
    return null;
  }
  function cartTotals(){
    var lines = store.cart.map(function(l){ return { l: l, p: product(l.productId) }; }).filter(function(x){ return x.p; });
    var qty = lines.reduce(function(s, x){ return s + x.l.qty; }, 0), pct = orderPct(qty);
    var sub = 0, list = 0;
    lines.forEach(function(x){ x.por = onRequest(x.p); x.price = x.por ? 0 : priceAt(x.p, pct); x.amount = x.price * x.l.qty; sub += x.amount; list += (x.p.base || 0) * x.l.qty; });
    return { lines: lines, qty: qty, pct: pct, sub: sub, saved: list - sub, next: nextSlab(qty), por: lines.filter(function(x){ return x.por; }).length };
  }

  // ---------- sync: pack, requests ----------
  function subscribe(){
    if(channel || !sb) return;
    try{
      channel = sb.channel('tt-buyer-' + Math.random().toString(36).slice(2, 8))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'buyer_packs' }, function(){ refreshSoon(250); })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'buyer_requests' }, function(){ refreshSoon(300); })
        .subscribe(function(st){ cloud.rtDb = st; renderSync(); });
    }catch(e){}
    try{
      live = sb.channel('tt-live', { config: { broadcast: { self: false } } })
        .on('broadcast', { event: 'ping' }, function(m){ if(m && m.payload && m.payload.kind === 'buyers') refreshSoon(150); })
        .subscribe(function(st){ cloud.rtLive = st; renderSync(); });
    }catch(e){}
  }
  function ping(kind){ try{ if(live && cloud.rtLive === 'SUBSCRIBED') live.send({ type: 'broadcast', event: 'ping', payload: { kind: kind } }); }catch(e){} }
  function refreshSoon(ms){ clearTimeout(cloud.refreshTimer); cloud.refreshTimer = setTimeout(refresh, ms || 0); }

  async function refresh(){
    if(!sb || !session) return;
    var r = await sb.from('buyer_packs').select('client_id,pack,updated_at').order('client_id');
    if(r.error){
      cloud.missing = /does not exist|schema cache|relation/i.test(r.error.message || '');
      cloud.status = /fetch|network|Load failed/i.test(r.error.message || '') || !navigator.onLine ? 'offline' : 'error';
      renderAll(); return;
    }
    var rows = r.data || [];
    if(!rows.length){ store.pack = null; save(); renderAll(); return; }
    var row = rows.find(function(x){ return x.client_id === store.clientId; });
    if(!row && rows.length > 1){ cloud.choosing = rows; store.pack = null; renderAll(); return; }
    row = row || rows[0];
    cloud.choosing = null;
    var prev = store.clientId === row.client_id ? store.pack : null;
    if(store.clientId && store.clientId !== row.client_id){ store.cart = []; store.docs = blankDocs(); store.pending = []; }
    store.clientId = row.client_id; store.pack = row.pack;
    cloud.status = 'ok';
    await Promise.all([loadRequests(), loadDocs()]);
    store.cart = store.cart.filter(function(l){ return product(l.productId); });
    save();
    if(prev) notifyChanges(prev, row.pack);
    flushDocs();
    renderAll();
  }
  async function loadRequests(){
    var r = await sb.from('buyer_requests').select('id,kind,payload,status,reply,created_at,updated_at').eq('client_id', store.clientId).order('created_at', { ascending: false }).limit(100);
    if(r.error) return;
    var before = {};
    (store.requests || []).forEach(function(q){ before[q.id] = q.status; });
    var answered = (r.data || []).filter(function(q){ return before[q.id] === 'open' && q.status !== 'open' && q.status !== 'cancelled'; });
    store.requests = r.data || [];
    if(answered.length) toast('Thread Tribe replied' + (answered[0].reply ? ': ' + answered[0].reply : ''));
  }
  function notifyChanges(prev, next){
    var before = {}, msgs = [];
    (prev.orders || []).forEach(function(o){ before[o.id] = o; });
    (next.orders || []).forEach(function(o){
      var b = before[o.id];
      if(b && b.status !== o.status) msgs.push((o.displayId || 'Order') + (o.status === 'shipped' ? ' has been dispatched' + (o.courier ? ' via ' + o.courier : '') : ' is now ' + (STATUS[o.status] || o.status).toLowerCase()));
      else if(b && o.trackingNo && b.trackingNo !== o.trackingNo) msgs.push((o.displayId || 'Order') + ' tracking: ' + (o.courier ? o.courier + ' ' : '') + o.trackingNo);
      else if(b && o.dispatchBy && b.dispatchBy !== o.dispatchBy) msgs.push((o.displayId || 'Order') + ' ships by ' + fmtDate(o.dispatchBy));
    });
    if(msgs.length) toast(msgs.slice(0, 2).join(' · '));
  }
  async function submitRequest(kind, payload){
    if(!session){ toast('Sign in again to send this'); return false; }
    var r = await sb.rpc('buyer_submit_request', { p_client_id: store.clientId, p_kind: kind, p_payload: payload });
    if(r.error){ toast(friendlyErr(r.error)); return false; }
    ping('request');
    await loadRequests();
    save();
    return true;
  }

  // ---------- sync: the reseller's own documents (private to them) ----------
  async function loadDocs(){
    var r = await sb.from('reseller_docs').select('coll,id,data,deleted').eq('client_id', store.clientId).limit(20000);
    if(r.error){ cloud.bizMissing = /reseller_docs|does not exist|schema cache|relation/i.test(r.error.message || ''); return; }
    cloud.bizMissing = false;
    var fresh = blankDocs();
    (r.data || []).forEach(function(x){ if(!x.deleted && x.data && fresh[x.coll]) fresh[x.coll][x.id] = x.data; });
    // Local edits not yet saved win over what the server had.
    store.pending.forEach(function(p){ if(p.deleted) delete fresh[p.coll][p.id]; else fresh[p.coll][p.id] = p.data; });
    store.docs = fresh;
  }
  function put(coll, id, data){
    store.docs[coll][id] = data;
    store.pending = store.pending.filter(function(p){ return !(p.coll === coll && p.id === id); });
    store.pending.push({ coll: coll, id: id, data: data, deleted: false });
    save(); flushDocs();
  }
  function remove(coll, id){
    delete store.docs[coll][id];
    store.pending = store.pending.filter(function(p){ return !(p.coll === coll && p.id === id); });
    store.pending.push({ coll: coll, id: id, data: null, deleted: true });
    save(); flushDocs();
  }
  async function flushDocs(){
    if(!sb || !session || !store.clientId || cloud.flushing || !store.pending.length || cloud.bizMissing) return;
    cloud.flushing = true;
    var batch = store.pending.slice(0, 200);
    var r = await sb.from('reseller_docs').upsert(batch.map(function(p){ return { client_id: store.clientId, coll: p.coll, id: p.id, data: p.data, deleted: p.deleted }; }), { onConflict: 'client_id,coll,id' });
    cloud.flushing = false;
    if(r.error){ setTimeout(flushDocs, 20000); return; }
    store.pending = store.pending.filter(function(p){ return batch.indexOf(p) === -1; });
    save();
    if(store.pending.length) flushDocs();
  }
  function list(coll){ return Object.keys(store.docs[coll] || {}).map(function(id){ return Object.assign({ id: id }, store.docs[coll][id]); }); }
  function settings(){
    var s = store.docs.settings.main || {}, c = pack().client || {}, b = pack().business || {};
    return Object.assign({
      bizName: c.name || '', gstin: c.gstin || '', address: c.address || '', city: c.city || '', state: c.state || '', phone: c.phone || '', email: c.email || '',
      upi: '', bank: '', invoicePrefix: 'INV-', nextNo: 1, markup: 30, gstRate: b.gstRate || 18, hsn: '9503', terms: 'Goods once sold will not be taken back. Payment due on delivery.',
      stockStart: '', lowStock: 20, custSlabs: [], maxCustDiscount: 15
    }, s);
  }
  function saveSettings(patch){ put('settings', 'main', Object.assign(settings(), patch)); }

  // ---------- the reseller's own pricing ----------
  function costOf(p){ return priceAt(p, T().tierPct); } // their current buying price before quantity extras
  function sellPrice(p){
    var o = store.docs.prices[p.id];
    if(o && o.sell > 0) return o.sell;
    if(onRequest(p)) return p.retail || 0;
    return Math.round(costOf(p) * (1 + num(settings().markup) / 100));
  }
  function custSlabFor(total){ var p = 0; (settings().custSlabs || []).forEach(function(s){ if(total >= s.min) p = s.pct; }); return p; }
  function custDiscount(customer, total){ return Math.min(num(settings().maxCustDiscount) || 100, num(customer && customer.discount) + custSlabFor(total)); }

  // ---------- stock ----------
  function stockRows(){
    var s = settings(), start = s.stockStart, by = {};
    function row(id, name){ if(!by[id]) by[id] = { id: id, name: name, inQty: 0, outQty: 0, adj: 0 }; return by[id]; }
    if(!start) return [];
    pack().orders.forEach(function(o){
      if(o.status !== 'delivered' || (o.deliveryDate || o.orderedDate || '') < start) return;
      o.lines.forEach(function(l){ if(l.catalogId) row(l.catalogId, l.name).inQty += l.qty; });
    });
    list('invoices').forEach(function(inv){
      if(inv.status === 'cancelled' || (inv.date || '') < start) return;
      (inv.lines || []).forEach(function(l){ if(l.productId) row(l.productId, l.name).outQty += num(l.qty); });
    });
    list('stock').forEach(function(m){ if(m.productId) row(m.productId, m.name).adj += num(m.qty); });
    return Object.keys(by).map(function(id){ var r = by[id], p = product(id); r.name = p ? p.name : r.name; r.onHand = r.inQty - r.outQty + r.adj; return r; })
      .sort(function(a, b){ return a.onHand - b.onHand; });
  }
  function onHand(id){ var r = stockRows().find(function(x){ return x.id === id; }); return r ? r.onHand : null; }
  function lowStock(){ var lim = num(settings().lowStock); return stockRows().filter(function(r){ return r.onHand <= lim && product(r.id); }); }

  // ======================= sign in =======================
  async function boot(){
    load();
    if(!window.supabase){ cloud.booting = false; renderAll(); return; }
    sb = window.supabase.createClient(CLOUD_URL, CLOUD_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'tt-buyer-auth' } });
    var s = await sb.auth.getSession();
    session = s.data && s.data.session;
    cloud.booting = false;
    sb.auth.onAuthStateChange(function(ev, sess){ session = sess; if(ev === 'SIGNED_OUT') renderAll(); });
    loadWebToys().then(function(){ if(store.pack) renderAll(); });
    if(session){ store.email = session.user.email || store.email; subscribe(); await refresh(); }
    renderAll();
    setInterval(function(){ if(!document.hidden && session) refresh(); }, 60000);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden && session) refreshSoon(200); });
    window.addEventListener('online', function(){ flushDocs(); refreshSoon(300); });
  }
  // ---------- install as an app ----------
  // Android Chrome / desktop Chrome and Edge give a one-tap install prompt; iPhone and
  // in-app browsers (WhatsApp, Instagram) don't, so those get step-by-step instructions.
  var install = { prompt: null, done: false };
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); install.prompt = e; renderAll(); });
  window.addEventListener('appinstalled', function(){ install.done = true; install.prompt = null; toast('Installed — open Thread Tribe Trade from your home screen'); renderAll(); });
  function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function inAppBrowser(){ return /FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(navigator.userAgent); }
  function canInstall(){ return !isStandalone() && !install.done; }
  async function doInstall(){
    if(install.prompt){
      var pr = install.prompt; install.prompt = null;
      pr.prompt();
      try{ var ch = await pr.userChoice; if(ch && ch.outcome === 'accepted') install.done = true; }catch(e){}
      renderAll(); return;
    }
    openSheet('<div class="sheet-h"><div class="t">Install the app</div><button class="x" data-a="close">✕</button></div>' + installSteps() +
      '<div class="btns"><button class="btn block" data-a="copy-link">Copy the app link</button></div>');
  }

  // ======================= home: insights from their history =======================
  // What they paid Thread Tribe per piece, averaged over their orders (falls back to today's price).
  function paidPerPiece(){
    var by = {};
    realOrders().forEach(function(o){ o.lines.forEach(function(l){
      if(!l.catalogId) return;
      if(!by[l.catalogId]) by[l.catalogId] = { qty: 0, amt: 0 };
      by[l.catalogId].qty += l.qty; by[l.catalogId].amt += l.qty * l.unitPrice;
    }); });
    return function(id){ var x = by[id]; if(x && x.qty) return x.amt / x.qty; var p = product(id); return p ? costOf(p) : 0; };
  }
  // Saved = trade discounts on their Thread Tribe orders (list price minus what they paid).
  function savingsStats(){
    var m0 = monthKey(today()), y1 = daysAgo(365), s = { month: 0, year: 0, months: {}, prods: {} };
    realOrders().forEach(function(o){
      var d = o.orderedDate || '';
      o.lines.forEach(function(l){
        var v = Math.max(0, ((l.listPrice || l.unitPrice) - l.unitPrice) * l.qty);
        if(monthKey(d) === m0) s.month += v;
        if(d >= y1){
          s.year += v; s.months[monthKey(d)] = (s.months[monthKey(d)] || 0) + v;
          var k = l.catalogId || l.name;
          if(!s.prods[k]) s.prods[k] = { id: l.catalogId, name: l.name, qty: 0, last: '' };
          s.prods[k].qty += l.qty; if(d > s.prods[k].last) s.prods[k].last = d;
        }
      });
    });
    s.products = Object.keys(s.prods).map(function(k){ return s.prods[k]; }).sort(function(a, b){ return b.qty - a.qty; });
    return s;
  }
  // Earned = what they sold to their buyers (after their discounts, before GST) minus what those pieces cost them.
  function salesStats(){
    var m0 = monthKey(today()), y1 = daysAgo(365), cost = paidPerPiece();
    var invs = list('invoices').filter(function(i){ return i.status !== 'cancelled'; });
    var s = { month: 0, year: 0, salesYear: 0, months: {}, count: invs.length, receivable: 0, customers: {} };
    invs.forEach(function(i){
      var keep = 1 - (i.discountPct || 0) / 100, earned = 0;
      (i.lines || []).forEach(function(l){ earned += num(l.qty) * num(l.rate) * keep - (l.productId ? num(l.qty) * cost(l.productId) : 0); });
      if(monthKey(i.date) === m0) s.month += earned;
      if((i.date || '') >= y1){ s.year += earned; s.salesYear += i.taxable || 0; s.months[monthKey(i.date)] = (s.months[monthKey(i.date)] || 0) + earned; }
      s.receivable += Math.max(0, (i.total || 0) - (i.paid || 0));
      var c = (i.customer && (i.customer.business || i.customer.name)) || 'Walk-in';
      s.customers[c] = (s.customers[c] || 0) + earned;
    });
    s.topCustomers = Object.keys(s.customers).map(function(k){ return [k, s.customers[k]]; }).sort(function(a, b){ return b[1] - a[1]; }).slice(0, 3);
    return s;
  }
  // Two bars a month: earned (accent) and saved (green).
  function chart(earned, saved){
    var keys = [], d = new Date(); d.setDate(1);
    for(var i = 11; i >= 0; i--){ var x = new Date(d.getFullYear(), d.getMonth() - i, 1); keys.push(iso(x).slice(0, 7)); }
    var max = Math.max.apply(null, keys.map(function(k){ return Math.max(earned[k] || 0, saved[k] || 0); }).concat([1]));
    function h(v){ return Math.max(v > 0 ? 3 : 0, Math.round(100 * Math.max(0, v) / max)); }
    return '<div class="chart">' + keys.map(function(k){
      var e = earned[k] || 0, s = saved[k] || 0;
      return '<div class="b" title="' + monthLabel(k) + ': earned ' + money(e) + ', saved ' + money(s) + '"><div class="pair"><i style="height:' + h(e) + '%"></i><i class="sv" style="height:' + h(s) + '%"></i></div><span>' + monthLabel(k).slice(0, 1) + '</span></div>';
    }).join('') + '</div><div class="legend"><span><i></i>Earned</span><span><i class="sv"></i>Saved</span></div>';
  }

  }
  function activeFilters(){ var f = store.filt; return (f.min !== '' || f.max !== '' ? 1 : 0) + (f.ordered ? 1 : 0) + (f.retailOnly ? 1 : 0); }
  function shopList(){
    var f = store.filt, q = shopQuery.toLowerCase(), ordered = orderedIds();
    var min = parseFloat(f.min), max = parseFloat(f.max);
    var items = catalogue().filter(function(p){
      var price = costOf(p);

      if((isFinite(min) || isFinite(max)) && onRequest(p)) return false;
      if(isFinite(min) && price < min) return false;
      if(isFinite(max) && price > max) return false;
      if(f.ordered && !ordered[p.id]) return false;
      if(f.retailOnly && !p.retail) return false;
      return true;
    });
    var by = {
      recommended: function(a, b){ return (ordered[b.id] || 0) - (ordered[a.id] || 0) || a.name.localeCompare(b.name); },
      price_asc: function(a, b){ return (a.base || 1e9) - (b.base || 1e9); }, price_desc: function(a, b){ return (b.base || 0) - (a.base || 0); },

  // Phone photos are several MB; shrink to ~1000 px JPEG so a claim stays small.
  function shrinkPhoto(file){
    return new Promise(function(resolve){
      var fr = new FileReader();
      fr.onload = function(){
        var img = new Image();
        img.onload = function(){
          var sc = Math.min(1, 1000 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
          cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/jpeg', 0.6));
        };
        img.onerror = function(){ resolve(''); };
        img.src = fr.result;
      };
      fr.onerror = function(){ resolve(''); };
      fr.readAsDataURL(file);
    });
  }
  async function addClaimPhotos(files){
    for(var i = 0; i < files.length && claimPhotos.length < 3; i++){ var d = await shrinkPhoto(files[i]); if(d) claimPhotos.push(d); }
    var t = document.getElementById('cl-thumbs');
    if(t) t.innerHTML = claimPhotos.map(function(d, i){ return '<div class="thumb"><img src="' + d + '" alt=""><button class="x" data-a="del-photo" data-i="' + i + '">✕</button></div>'; }).join('');

  async function sendClaim(orderId){

      var l = o.lines[+el.getAttribute('data-claim')], q = Math.max(0, Math.min(l.qty, Math.round(num(el.value))));

    var btn = document.querySelector('[data-a="send-claim"]'); if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
    var ok = await submitRequest('claim', { orderId: o.id, displayId: o.displayId, issue: val('cl-issue'), want: val('cl-want'), notes: val('cl-notes'), lines: lines, photos: claimPhotos.slice(0, 3) });

  function reorder(id){
    var o = pack().orders.find(function(x){ return x.id === id; }); if(!o) return;
    var added = 0, missing = 0, t = T();
    o.lines.forEach(function(l){

      var qty = Math.max(t.minPerProduct, l.qty), c = store.cart.find(function(x){ return x.productId === p.id; });

  function newDraft(customerId){
    var s = settings();

  }
  function draftCalc(d){
    var s = settings(), cust = d.customerId ? store.docs.customers[d.customerId] : null;
    var qty = d.lines.reduce(function(t, l){ return t + num(l.qty); }, 0);
    var pct = custDiscount(cust, qty);
    var sub = d.lines.reduce(function(t, l){ return t + num(l.qty) * num(l.rate); }, 0);
    var discountAmt = r2(sub * pct / 100), taxable = r2(sub - discountAmt);
    var mine = (s.state || '').trim().toLowerCase(), theirs = ((cust && cust.state) || '').trim().toLowerCase();
    var inter = !!(mine && theirs && mine !== theirs);
    var tax = r2(taxable * num(d.gstRate) / 100);

    var b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    function two(x){ return x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : ''); }
    function three(x){ return (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : ''); }
    var out = [], cr = Math.floor(n / 1e7), lk = Math.floor(n / 1e5) % 100, th = Math.floor(n / 1000) % 100, rest = n % 1000;
    if(cr) out.push(three(cr) + ' Crore'); if(lk) out.push(two(lk) + ' Lakh'); if(th) out.push(two(th) + ' Thousand'); if(rest) out.push(three(rest));

  function dues(){

      if(due <= 0.5) return;
      var k = i.customerId || ('walkin:' + ((i.customer && (i.customer.business || i.customer.name)) || ''));
      if(!by[k]) by[k] = { key: k, customerId: i.customerId, customer: i.customer || {}, invoices: [], total: 0, oldest: i.date };
      by[k].invoices.push({ no: i.no, date: i.date, due: due });
      by[k].total += due;
      if((i.date || '') < by[k].oldest) by[k].oldest = i.date;
    });
    return Object.keys(by).map(function(k){ var d = by[k]; d.invoices.sort(function(a, b){ return (a.date || '').localeCompare(b.date || ''); }); return d; })
      .sort(function(a, b){ return b.total - a.total; });

    var c = i.customer || {}, se = i.seller || {}, due = Math.max(0, i.total - (i.paid || 0));
    var msg = 'Invoice ' + i.no + ' from ' + (se.bizName || '') + '\nDate: ' + fmtDate(i.date) + '\n' +
      (i.lines || []).map(function(l){ return '• ' + l.name + ' × ' + l.qty + ' @ ₹' + l.rate; }).join('\n') +
      '\nTotal: ' + money2(i.total) + (due > 0.5 ? '\nBalance due: ' + money2(due) : '\nPaid in full — thank you!') + (se.upi && due > 0.5 ? '\nUPI: ' + se.upi : '');
    var phone = String(c.phone || '').replace(/\D/g, '');
    if(phone.length === 10) phone = '91' + phone;
    window.open('https://wa.me/' + (phone.length >= 11 ? phone : '') + '?text=' + encodeURIComponent(msg), '_blank');
  }

  // ---- stock ----
  function adjustSheet(){
    openSheet('<div class="sheet-h"><div class="t">Adjust stock</div><button class="x" data-a="close">✕</button></div>' +
      '<p class="muted">For opening stock, damages, samples or a count correction.</p>' +
      '<label>Toy</label><select id="a-prod">' + catalogue().slice().sort(function(a, b){ return a.name.localeCompare(b.name); }).map(function(p){ return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('') + '</select>' +
      '<label>Change (use − for less)</label><input id="a-qty" type="number" placeholder="e.g. 50 or -3">' +
      '<label>Reason</label><input id="a-note" placeholder="Opening stock, damaged, count…">' +
      '<div class="btns"><button class="btn primary block" data-a="save-adjust">Save</button></div>');
  }

  // ======================= account =======================
  function renderAccount(){
    var p = pack(), c = p.client, invoices = p.orders.filter(function(o){ return o.invoiceNumber; }), due = p.orders.filter(function(o){ return o.due > 0; });
    return installCard(false) + '<div class="card big"><div class="k">You owe Thread Tribe</div><div class="v">' + money(totalDue()) + '</div><div class="muted">across ' + due.length + ' supply order' + (due.length === 1 ? '' : 's') + ' · pay on delivery</div></div>' +
      (due.length ? '<div class="card">' + due.map(function(o){ return '<div class="row"><span>' + esc(o.displayId) + ' · ' + esc(PAY[o.paymentStatus] || '') + '</span><span class="r">' + money2(o.due) + '</span></div>'; }).join('') + '</div>' : '') +
      '<div class="h2">Thread Tribe invoices <span class="count">' + invoices.length + '</span></div>' +
      (invoices.length ? '<div class="card">' + invoices.map(function(o){
        return '<div class="row" style="cursor:pointer" data-a="tt-invoice" data-id="' + esc(o.id) + '"><div><div style="font-weight:600">' + esc(o.invoiceNumber) + '</div><div class="muted">' + esc(o.displayId) + ' · ' + fmtDate(o.orderedDate) + '</div></div><span class="r">' + money2(o.total) + ' ›</span></div>';
      }).join('') + '</div>' : '<div class="card empty"><b>No invoices yet</b></div>') +
      '<div class="h2">Your details with Thread Tribe</div><div class="card">' +
      [['Business', c.name], ['Contact', c.contact], ['Phone', c.phone], ['Email', c.email], ['GSTIN', c.gstin], ['Address', [c.address, c.city, c.state].filter(Boolean).join(', ')]].map(function(r){
        return '<div class="row"><span class="muted">' + r[0] + '</span><span class="r" style="white-space:normal">' + esc(r[1] || '—') + '</span></div>';
      }).join('') + '<div class="btns"><button class="btn small" data-a="edit-profile">Request a change</button><button class="btn small" data-a="message">Message Thread Tribe</button></div></div>' +
      '<p class="muted" style="margin:14px 4px 0">Your customers, invoices and selling prices are private to you. Thread Tribe only sees how many of each toy you resell, by city.</p>' +
      '<div class="btns"><button class="btn small danger" data-a="signout">Sign out</button></div>';
  }
  function profileSheet(){
    var c = pack().client;
    openSheet('<div class="sheet-h"><div class="t">Update your details</div><button class="x" data-a="close">✕</button></div>' +
      '<p class="muted">Thread Tribe checks changes before they apply.</p>' +
      '<label>Contact name</label><input id="f-contact" value="' + esc(c.contact) + '">' +
      '<label>Phone</label><input id="f-phone" inputmode="tel" value="' + esc(c.phone) + '">' +
      '<label>GSTIN</label><input id="f-gstin" value="' + esc(c.gstin) + '" maxlength="15" style="text-transform:uppercase">' +
      '<label>Address</label><textarea id="f-address">' + esc(c.address) + '</textarea>' +
      '<div class="grid2"><div><label>City</label><input id="f-city" value="' + esc(c.city) + '"></div><div><label>State</label><input id="f-state" value="' + esc(c.state) + '"></div></div>' +
      '<div class="btns"><button class="btn primary block" data-a="send-profile">Send for approval</button></div>');
  }
  async function sendProfile(){
    var c = pack().client, out = {}, any = false;
    ['contact', 'phone', 'gstin', 'address', 'city', 'state'].forEach(function(f){
      var v = val('f-' + f); if(f === 'gstin') v = v.toUpperCase();
      if(v && v !== (c[f] || '')){ out[f] = v.slice(0, 300); any = true; }
    });
    if(!any){ toast('Nothing changed'); return; }
    if(await submitRequest('profile', out)){ closeSheet(); toast('Sent to Thread Tribe'); renderAll(); }
  }
  function messageSheet(){
    openSheet('<div class="sheet-h"><div class="t">Message Thread Tribe</div><button class="x" data-a="close">✕</button></div>' +
      '<textarea id="msg" maxlength="2000" placeholder="Question about a supply order, a toy, delivery…"></textarea>' +
      '<div class="btns"><button class="btn primary block" data-a="send-msg">Send</button></div>');
  }
  function showTTInvoice(id){
    var p = pack(), o = p.orders.find(function(x){ return x.id === id; }); if(!o) return;
    var b = p.business, c = p.client, sub = o.lines.reduce(function(s, l){ return s + l.qty * l.unitPrice; }, 0);
    var el = document.getElementById('inv');
    el.innerHTML = '<div class="bar2"><button class="btn small" data-a="print">Print / Save PDF</button><button class="btn small" data-a="close-inv">Close</button></div><div class="doc">' +
      '<h1>Tax invoice ' + esc(o.invoiceNumber) + '</h1><div>Order ' + esc(o.displayId) + ' · ' + fmtDate(o.orderedDate) + '</div>' +
      '<div class="meta"><div><b>' + esc(b.name) + '</b><br>' + esc(b.address).replace(/\n/g, '<br>') + (b.gst ? '<br>GSTIN ' + esc(b.gst) : '') + (b.phone ? '<br>' + esc(b.phone) : '') + '</div>' +
      '<div><b>Bill to</b><br>' + esc(c.name) + '<br>' + esc([c.address, c.city, c.state].filter(Boolean).join(', ')) + (c.gstin ? '<br>GSTIN ' + esc(c.gstin) : '') + '</div></div>' +
      '<table><tr><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr>' +
      o.lines.map(function(l){ return '<tr><td>' + esc(l.name) + (l.color ? ' (' + esc(l.color) + ')' : '') + '</td><td class="n">' + l.qty + '</td><td class="n">' + money2(l.unitPrice) + '</td><td class="n">' + money2(l.qty * l.unitPrice) + '</td></tr>'; }).join('') +
      '</table><table class="tot">' +
      (Math.round(sub) !== Math.round(o.subtotal) ? '<tr><td>Order discount</td><td class="n">−' + money2(sub - o.subtotal) + '</td></tr>' : '') +
      '<tr><td>Taxable value</td><td class="n">' + money2(o.subtotal) + '</td></tr>' +
      (o.gstRate ? '<tr><td>GST ' + o.gstRate + '%</td><td class="n">' + money2(o.gst) + '</td></tr>' : '') +
      '<tr><td><b>Total</b></td><td class="n"><b>' + money2(o.total) + '</b></td></tr>' +
      '<tr><td>Paid</td><td class="n">' + money2(o.paid) + '</td></tr><tr><td><b>Balance due</b></td><td class="n"><b>' + money2(o.due) + '</b></td></tr></table>' +
      '<p style="color:#666;font-size:12px">Copy of the invoice issued by ' + esc(b.name) + '. For the GST-filed original, ask Thread Tribe.</p></div>';
    el.classList.remove('hidden');
  }

  // ======================= sheet =======================
  function openSheet(html){
    document.getElementById('sheetBody').innerHTML = html;
    var s = document.getElementById('sheet'), sc = document.getElementById('scrim');
    s.classList.remove('hidden'); sc.classList.remove('hidden');
    requestAnimationFrame(function(){ s.classList.add('show'); sc.classList.add('show'); });
  }
  function closeSheet(){
    var s = document.getElementById('sheet'), sc = document.getElementById('scrim');
    s.classList.remove('show'); sc.classList.remove('show');
    setTimeout(function(){ s.classList.add('hidden'); sc.classList.add('hidden'); }, 220);
  }

  // ======================= events =======================
  document.addEventListener('click', async function(e){
    var go = e.target.closest('[data-go]');
    if(go){ tab = go.getAttribute('data-go'); renderAll(); window.scrollTo(0, 0); return; }
    var nb = e.target.closest('#nav [data-tab]');
    if(nb){ tab = nb.getAttribute('data-tab'); bizQuery = ''; renderAll(); window.scrollTo(0, 0); return; }
    var sg = e.target.closest('[data-seg]');
    if(sg){ shopSeg = sg.getAttribute('data-seg'); renderAll(); return; }
    var os = e.target.closest('[data-oseg]');
    if(os){ orderSeg = os.getAttribute('data-oseg'); renderAll(); return; }
    var bs = e.target.closest('[data-bseg]');
    if(bs){ bizSeg = bs.getAttribute('data-bseg'); bizQuery = ''; renderAll(); return; }
    if(e.target.id === 'scrim'){ closeSheet(); draft = null; return; }
    if(e.target.closest('#sync')){ flushDocs(); refreshSoon(0); toast('Refreshing…'); return; }
    var a = e.target.closest('[data-a]');
    if(!a) return;
    var act = a.getAttribute('data-a'), id = a.getAttribute('data-id');
    if(act === 'install') doInstall();
    else if(act === 'install-later'){ store.installHideUntil = Date.now() + 14 * 86400000; save(); renderAll(); }
    else if(act === 'copy-link'){
      var link = location.origin + location.pathname;
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(function(){ toast('Link copied — paste it into Chrome or Safari'); }).catch(function(){ prompt('Copy this link:', link); });
    }
    else if(act === 'send-code') sendCode();
    else if(act === 'verify') verify();
    else if(act === 'restart'){ cloud.otpEmail = ''; cloud.err = ''; renderSignin(); }
    else if(act === 'signout'){ if(confirm('Sign out of the Thread Tribe trade app?')) signOut(); }
    else if(act === 'refresh') refresh();
    else if(act === 'choose'){ store.clientId = id; cloud.choosing = null; save(); refresh(); }
    // shop & cart
    else if(act === 'product') productSheet(id);
    else if(act === 'filters') filterSheet();
    else if(act === 'share-catalog') shareSheet();
    else if(act === 'share-pdf') sharePdf();
    else if(act === 'share-text') shareText();
    else if(act === 'apply-filters') applyFilters();
    else if(act === 'clear-filters'){ store.filt = Object.assign(blankFilt(), { sort: store.filt.sort }); save(); closeSheet(); renderAll(); }
    else if(act === 'unfilter'){
      var k = a.getAttribute('data-k'), f = store.filt;
      if(k === 'price'){ f.min = ''; f.max = ''; } else if(k === 'ordered') f.ordered = false; else if(k === 'retail') f.retailOnly = false;
      save(); renderAll();
    }
    else if(act === 'set-qty'){ var qi = document.getElementById('pq'); if(qi){ qi.value = a.getAttribute('data-v'); updateLine(); } }
    else if(act === 'qty-' || act === 'qty+'){ var q = document.getElementById('pq'); q.value = Math.max(T().minPerProduct, Math.round(num(q.value)) + (act === 'qty+' ? 5 : -5)); updateLine(); }
    else if(act === 'add'){ if(addToCart(id, Math.round(num(val('pq'))), val('pc').slice(0, 60))){ closeSheet(); renderAll(); } }
    else if(act === 'quick-add'){ var ex = store.cart.find(function(x){ return x.productId === id; }); addToCart(id, ex ? ex.qty : Math.max(T().minPerProduct, 25)); renderAll(); }
    else if(act === 'remove'){ store.cart.splice(parseInt(a.getAttribute('data-i'), 10), 1); save(); renderAll(); }
    else if(act === 'place') placeOrder();
    // orders
    else if(act === 'order') orderSheet(id);
    else if(act === 'reorder') reorder(id);
    else if(act === 'claim') claimSheet(id);
    else if(act === 'remind') remind(a.getAttribute('data-k'));
    else if(act === 'export') exportSheet();
    else if(act === 'export-register') exportRegister();
    else if(act === 'export-hsn') exportHsn();
    else if(act === 'copy-awb'){ var awb = a.getAttribute('data-v'); (navigator.clipboard ? navigator.clipboard.writeText(awb) : Promise.reject()).then(function(){ toast('Copied ' + awb); }).catch(function(){ prompt('AWB', awb); }); }
    else if(act === 'send-claim') sendClaim(id);
    else if(act === 'del-photo'){ claimPhotos.splice(+a.getAttribute('data-i'), 1); addClaimPhotos([]); }
    else if(act === 'tt-invoice'){ closeSheet(); showTTInvoice(id); }
    else if(act === 'print') window.print();
    else if(act === 'close-inv') document.getElementById('inv').classList.add('hidden');
    else if(act === 'close'){ closeSheet(); draft = null; }
    // business
    else if(act === 'new-invoice'){ draft = newDraft(); invoiceEditor(); }
    else if(act === 'invoice-for'){ draft = newDraft(id); invoiceEditor(); }
    else if(act === 'invoice') showInvoice(id);
    else if(act === 'edit-invoice') editInvoice(id);
    else if(act === 'del-line'){ readDraftForm(); draft.lines.splice(+a.getAttribute('data-i'), 1); invoiceEditor(); }
    else if(act === 'save-invoice') saveInvoice();
    else if(act === 'pay') recordPayment(id);
    else if(act === 'cancel-invoice') cancelInvoice(id);
    else if(act === 'share-invoice') shareInvoice(id);
    else if(act === 'edit-customer') customerSheet(id);
    else if(act === 'save-customer'){
      var cid = saveCustomer(id);
      if(!cid) return;
      if(draft){ draft.customerId = cid; invoiceEditor(); } else { closeSheet(); renderAll(); }
      toast('Customer saved');
    }
    else if(act === 'del-customer'){ if(confirm('Delete this customer? Their past invoices stay.')){ remove('customers', id); closeSheet(); renderAll(); } }
    else if(act === 'start-stock'){ saveSettings({ stockStart: today() }); renderAll(); adjustSheet(); toast('Add what you have on hand today'); }
    else if(act === 'adjust-stock') adjustSheet();
    else if(act === 'save-adjust'){
      var pid = val('a-prod'), qn = Math.round(num(val('a-qty'))), pr = product(pid);
      if(!pr || !qn){ toast('Pick a toy and a quantity'); return; }
      put('stock', uid(), { productId: pid, name: pr.name, qty: qn, note: val('a-note'), date: today() });
      closeSheet(); renderAll(); toast('Stock updated');
    }
    else if(act === 'add-cslab'){
      var mn = Math.round(num(val('csMin'))), pc = Math.max(0, Math.min(100, num(val('csPct'))));
      if(mn < 1 || !pc){ toast('Enter pieces and a discount %'); return; }
      var sl = (settings().custSlabs || []).filter(function(x){ return x.min !== mn; }).concat([{ min: mn, pct: pc }]).sort(function(x, y){ return x.min - y.min; });
      saveSettings({ custSlabs: sl }); renderAll();
    }
    else if(act === 'del-cslab'){ var sl2 = (settings().custSlabs || []).slice(); sl2.splice(+a.getAttribute('data-i'), 1); saveSettings({ custSlabs: sl2 }); renderAll(); }
    else if(act === 'save-settings') saveInvoiceSettings();
    // account
    else if(act === 'edit-profile') profileSheet();
    else if(act === 'send-profile') sendProfile();
    else if(act === 'message') messageSheet();
    else if(act === 'send-msg'){
      var txt = val('msg');
      if(!txt){ toast('Write a message first'); return; }
      if(await submitRequest('message', { text: txt.slice(0, 2000) })){ closeSheet(); toast('Sent to Thread Tribe'); renderAll(); }
    }
    else if(act === 'cancel-req'){
      if(!confirm('Cancel this request?')) return;
      var r = await sb.rpc('buyer_cancel_request', { p_id: id });
      if(r.error) toast(friendlyErr(r.error)); else { ping('request'); await loadRequests(); save(); renderAll(); }
    }
  });
  document.addEventListener('change', function(e){
    var t = e.target;
    if(t.id === 'sortSel'){ store.filt.sort = t.value; save(); renderAll(); }
    else if(t.id === 'cl-photos'){ addClaimPhotos(t.files || []); t.value = ''; }
    else if(t.id === 'sh-which'){ var pk = document.getElementById('sh-pick'); if(pk) pk.classList.toggle('hidden', t.value !== 'pick'); }
    else if(t.id === 'sh-prices'){ var cw = document.getElementById('sh-custwrap'); if(cw) cw.classList.toggle('hidden', t.value !== 'cust'); }
    else if(t.id === 'd-cust'){
      if(t.value === '__new'){ readDraftForm(); customerSheet(null); return; }
      readDraftForm(); invoiceEditor();
    }
    else if(t.id === 'd-add'){
      readDraftForm();
      if(t.value === '__custom'){
        var nm = prompt('Item name'); if(!nm) { invoiceEditor(); return; }
        var rt = num(prompt('Rate per piece (₹)', '0'));
        draft.lines.push({ productId: '', name: nm.slice(0, 120), qty: 1, rate: rt, hsn: settings().hsn });
      } else if(t.value){
        var p = product(t.value), ex = draft.lines.find(function(l){ return l.productId === t.value; });
        if(ex) ex.qty += 10; else if(p) draft.lines.push({ productId: p.id, name: p.name, qty: 10, rate: sellPrice(p), hsn: (store.docs.prices[p.id] && store.docs.prices[p.id].hsn) || settings().hsn });
      }
      invoiceEditor();
    }
    else if(t.hasAttribute('data-lqty') || t.hasAttribute('data-lrate') || t.id === 'd-gst' || t.id === 'd-date'){ readDraftForm(); invoiceEditor(); }
    else if(t.hasAttribute('data-sell')){
      var pid = t.getAttribute('data-sell'), v = Math.max(0, Math.round(num(t.value)));
      if(v) put('prices', pid, Object.assign({}, store.docs.prices[pid] || {}, { sell: v })); else remove('prices', pid);
      renderAll();
    }
    else if(t.id === 'markup'){ saveSettings({ markup: Math.max(0, num(t.value)) }); renderAll(); }
    else if(t.id === 'maxCust'){ saveSettings({ maxCustDiscount: Math.max(0, Math.min(100, num(t.value))) }); toast('Saved'); }
    else if(t.id === 'lowStock'){ saveSettings({ lowStock: Math.max(0, Math.round(num(t.value))) }); renderAll(); }
  });
  document.addEventListener('input', function(e){
    var id = e.target.id;
    if(id === 'q' || id === 'bq'){
      if(id === 'q') shopQuery = e.target.value; else bizQuery = e.target.value;
      var pos = e.target.selectionStart;
      renderAll();
      var el = document.getElementById(id); if(el){ el.focus(); try{ el.setSelectionRange(pos, pos); }catch(err){} }
    } else if(id === 'pq') updateLine();
  });
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    if(e.target.id === 'em') sendCode();
    else if(e.target.id === 'code') verify();
  });

  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function(){});
  boot();
})();
</script>
</body>
